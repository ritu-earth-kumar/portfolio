<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritendrakumar Guntreddi – VC Analyst Portfolio</title>
</head>
<body>
  <p id="status">Loading portfolio…</p>
  <script>
    fetch("Ritendrakumar%20Guntreddi%20%E2%80%93%20VC%20Analyst%20Portfolio.html")
      .then(function (response) {
        if (!response.ok) throw new Error("Portfolio could not be loaded.");
        return response.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.getElementById("status").innerHTML =
          'Portfolio failed to load. <a href="Ritendrakumar%20Guntreddi%20%E2%80%93%20VC%20Analyst%20Portfolio.html">Open it here</a>.';
      });
  </script>
</body>
</html>
